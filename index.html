<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="고깔 다섯 개 중 셋을 내 자리에 모아 1초 버티는 운동장 게임">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9EFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="./favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>고깔 셋</title>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div id="hud" class="hud" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="count" class="count" aria-hidden="true" hidden></div>
<button id="homeBtn" class="homebtn" type="button" hidden>
  <svg id="compass" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-opacity=".25"/><path id="needle" d="M14 5 L19.5 18 L14 15.2 L8.5 18 Z" fill="currentColor"/></svg>
  <span data-t="home"></span>
</button>

<section id="menu" class="panel" aria-labelledby="ttl">
  <div class="brand">
    <svg viewBox="0 0 30 30" aria-hidden="true"><g fill="#F26B1D"><path d="M7.2 4h2.6l3.4 10H3.8z"/><path d="M20.2 4h2.6l3.4 10h-9.4z"/><path d="M13.5 10h3l4.2 13H9.3z"/><rect x="2.6" y="13.4" width="11.8" height="1.8" rx=".6"/><rect x="15.6" y="13.4" width="11.8" height="1.8" rx=".6"/><rect x="7.8" y="22.4" width="14.4" height="2.2" rx=".7"/></g><g fill="#fff"><path d="M6.4 7.4h4.2l.8 2.3H5.6z"/><path d="M19.4 7.4h4.2l.8 2.3h-5.8z"/><path d="M12.6 14.2h4.8l1 3H11.6z"/></g></svg>
    <h1 id="ttl" data-t="title"></h1>
    <button id="openSettings" class="iconbtn" type="button" data-aria="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
  </div>
  <p class="rule" data-t="rule"></p>
  <fieldset>
    <legend data-t="view"></legend>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="view" id="v-first" value="first"><span data-t="first"></span></label>
      <label><input type="radio" name="view" id="v-third" value="third"><span data-t="third"></span></label>
    </div>
    <p id="sixNote" class="note" data-t="six" hidden></p>
  </fieldset>
  <fieldset>
    <legend data-t="players"></legend>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="count" id="c3" value="3"><span data-n="3"></span></label>
      <label><input type="radio" name="count" id="c4" value="4"><span data-n="4"></span></label>
      <label><input type="radio" name="count" id="c5" value="5"><span data-n="5"></span></label>
      <label><input type="radio" name="count" id="c6" value="6"><span data-n="6"></span></label>
    </div>
  </fieldset>
  <p class="keys" data-t="keys"></p>
  <p id="menuErr" class="err" role="alert" hidden></p>
  <div class="row">
    <button id="solo" class="primary" type="button" data-t="solo"></button>
    <button id="together" class="secondary" type="button" data-t="together" hidden></button>
  </div>
</section>

<section id="joinPanel" class="panel" aria-labelledby="joinT" hidden>
  <h2 id="joinT" data-t="together"></h2>
  <p class="note" data-t="togetherNote"></p>
  <button id="create" class="primary" type="button" data-t="create"></button>
  <button id="scanJoin" class="secondary" type="button" data-t="scanJoin"></button>
  <p id="joinErr" class="err" role="alert" hidden></p>
  <button id="joinBack" class="secondary small" type="button" data-t="back"></button>
</section>

<section id="answerPanel" class="panel" aria-labelledby="ansT" hidden>
  <h2 id="ansT" data-t="showHost"></h2>
  <div id="ansQr" class="qr"></div>
  <p id="ansNote" class="note" data-t="showHostNote"></p>
  <details>
    <summary data-t="hostNoCam"></summary>
    <div class="row" style="margin-top:8px">
      <input id="ansText" class="code-in" type="text" readonly aria-label="code">
      <button id="ansCopy" class="secondary small" type="button" data-t="copy" style="flex:0 0 auto"></button>
    </div>
  </details>
  <button id="ansCancel" class="secondary small" type="button" data-t="cancel"></button>
</section>

<section id="lobby" class="panel" aria-labelledby="lobT" hidden>
  <div>
    <span id="lobT" class="lbl" data-t="people" style="display:block"></span>
    <div id="lobPeople" class="people"></div>
  </div>
  <div id="invite" class="invite" hidden>
    <div id="qrBox" class="qr"></div>
    <p id="inviteNote" class="note"></p>
    <div class="row">
      <button id="scanFriend" class="primary" type="button" data-t="scanFriend"></button>
      <button id="inviteCancel" class="secondary" type="button" data-t="cancel"></button>
    </div>
    <details>
      <summary data-t="noCam"></summary>
      <div class="row" style="margin-top:8px">
        <input id="pasteIn" class="code-in" type="text" autocomplete="off" aria-label="code">
        <button id="pasteGo" class="secondary small" type="button" data-t="paste" style="flex:0 0 auto"></button>
      </div>
    </details>
  </div>
  <button id="inviteBtn" class="secondary" type="button" data-t="invite"></button>
  <fieldset id="lobViewWrap">
    <legend data-t="view"></legend>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="lview" id="lv-first" value="first"><span data-t="first"></span></label>
      <label><input type="radio" name="lview" id="lv-third" value="third"><span data-t="third"></span></label>
    </div>
  </fieldset>
  <p id="lobNote" class="note"></p>
  <p id="lobErr" class="err" role="alert" hidden></p>
  <div class="row" id="lobRow">
    <button id="lobStart" class="primary" type="button" data-t="start"></button>
    <button id="lobLeave" class="secondary" type="button" data-t="leave"></button>
  </div>
</section>

<div id="scanner" class="scanner" hidden>
  <video id="scanVideo" playsinline muted></video>
  <div class="scanframe" aria-hidden="true"></div>
  <p class="scanhint" data-t="scanHint"></p>
  <button id="scanCancel" class="secondary scancancel" type="button" data-t="cancel"></button>
</div>

<section id="result" class="panel" aria-labelledby="resT" hidden>
  <h2 id="resT"></h2>
  <p id="resS" class="sub"></p>
  <p id="resWait" class="note" data-t="waitAgain" hidden></p>
  <div class="row">
    <button id="again" class="primary" type="button" data-t="again"></button>
    <button id="toMenu" class="secondary" type="button" data-t="menu"></button>
    <button id="toLobby" class="secondary" type="button" data-t="toLobby"></button>
    <button id="resLeave" class="secondary" type="button" data-t="leave"></button>
  </div>
</section>

<div id="controls" class="controls" hidden>
  <button id="bL" class="ctl" type="button" data-aria="left"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 9 14l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="bG" class="ctl grab" type="button"><span class="gmain" data-t="grab"></span><span id="gsub" class="gsub"></span></button>
  <button id="bR" class="ctl" type="button" data-aria="right"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="m11 6 8 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<div id="sheetScrim" class="scrim" hidden></div>
<section id="settings" class="sheet" role="dialog" aria-modal="true" aria-labelledby="setT" hidden>
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheethead">
    <h2 id="setT" data-t="settings"></h2>
    <button id="closeSettings" class="secondary small" type="button" data-t="done"></button>
  </div>
  <div class="setrow">
    <span data-t="sound"></span>
    <label class="switch"><input id="optSound" type="checkbox" role="switch"><span></span></label>
  </div>
  <div class="setrow" id="hapticRow">
    <span data-t="haptic"></span>
    <label class="switch"><input id="optHaptic" type="checkbox" role="switch"><span></span></label>
  </div>
  <fieldset>
    <legend data-t="theme"></legend>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="theme" id="th-auto" value="auto"><span data-t="auto"></span></label>
      <label><input type="radio" name="theme" id="th-light" value="light"><span data-t="light"></span></label>
      <label><input type="radio" name="theme" id="th-dark" value="dark"><span data-t="dark"></span></label>
    </div>
  </fieldset>
  <label class="langrow" for="lang">
    <span class="lbl">언어 · Language</span>
    <select id="lang">
      <option value="auto" data-t="auto"></option>
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select>
  </label>
  <div id="adBox" class="adbox" hidden>
    <button id="buyAdFree" class="primary" type="button"></button>
    <button id="restore" class="secondary small" type="button" data-t="restore"></button>
    <p id="buyMsg" class="note" role="status"></p>
  </div>
  <p id="adFreeDone" class="note" data-t="adFreeDone" hidden></p>
  <button id="adPrivacy" class="secondary small" type="button" data-t="adPrivacy" hidden></button>
  <a class="link" href="https://shpeterpan.github.io/gokkal/privacy.html" target="_blank" rel="noopener" data-t="privacy"></a>
</section>

<div id="coach" class="coach" role="status" hidden></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
