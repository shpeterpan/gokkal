<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="고깔 다섯 개 중 셋을 내 자리에 모아 1초 버티는 운동장 게임">
<meta name="theme-color" content="#E9EFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161B" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
</head>
<body>
<title>고깔 셋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
/* 판 전체가 운동장. 글과 조작은 가장자리에만 얹는다 */
:root {
  --bg: #E9EFF1;
  --surface: #FFFFFF;
  --surface-2: #EDF1F3;
  --ink: #15212B;
  --muted: #56646F;
  --line: #CDD6DC;
  --cone: #F26B1D;
  --on-cone: #1C1105;
  --cone-soft: rgb(242 107 29 / .14);
  --danger: #B42318;
  --ctl: rgb(255 255 255 / .86);
  --ctl-on: rgb(226 233 237 / .96);
  --focus: #1E63C4;
  --shade: rgb(12 22 30 / .2);
  --over: #FFFFFF;
  --over-shadow: rgb(10 20 28 / .5);
  --qr-bg: #FFFFFF;
  --scan-bg: #000000;
  --font-display: "Black Han Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161B; --surface: #1A2229; --surface-2: #222C34; --ink: #E6ECF0; --muted: #9BA9B3; --line: #33414B;
    --cone: #FF8A3D; --on-cone: #1C1105; --cone-soft: rgb(255 138 61 / .16); --danger: #FF8A80;
    --ctl: rgb(26 34 41 / .86); --ctl-on: rgb(46 58 68 / .96); --focus: #7DB2FF; --shade: rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161B; --surface: #1A2229; --surface-2: #222C34; --ink: #E6ECF0; --muted: #9BA9B3; --line: #33414B;
  --cone: #FF8A3D; --on-cone: #1C1105; --cone-soft: rgb(255 138 61 / .16); --danger: #FF8A80;
  --ctl: rgb(26 34 41 / .86); --ctl-on: rgb(46 58 68 / .96); --focus: #7DB2FF; --shade: rgb(0 0 0 / .45);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  line-height: 1.5; word-break: keep-all; overflow-wrap: break-word;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
h1, h2 { text-wrap: balance; }
p { text-wrap: pretty; margin: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* 시작·방·결과 판 */
.panel {
  position: fixed; z-index: 5;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: auto; overscroll-behavior: contain;
  box-sizing: border-box; display: grid; gap: 16px;
  padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 10px 28px var(--shade);
}
@media (min-width: 720px) {
  .panel { right: auto; width: 360px; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.panel h1, .panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: -0.01em; line-height: 1.2; }
.panel h1 { font-size: 34px; white-space: nowrap; }
.panel h2 { font-size: 30px; }
.rule { color: var(--muted); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 8px; }
legend, .lbl { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; margin-bottom: 8px; }
.seg { display: flex; gap: 6px; }
.seg label { flex: 1; position: relative; min-width: 0; }
.seg input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.seg span {
  display: flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box;
  border: 1px solid var(--line); border-radius: 10px; font-weight: 600; white-space: nowrap; background: var(--surface);
}
.seg input:checked + span { background: var(--cone-soft); border-color: var(--cone); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg input:disabled + span { opacity: .4; }
.seg input:disabled { cursor: default; }
.note { font-size: 13px; color: var(--muted); }
.err { font-size: 14px; color: var(--danger); font-weight: 600; }
.langrow { display: grid; gap: 0; }
select, .code-in {
  min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; box-sizing: border-box;
  border: 1px solid var(--line); background: var(--surface-2);
}
.code-in { width: 100%; min-width: 0; font-variant-numeric: tabular-nums; letter-spacing: .12em; -webkit-user-select: text; user-select: text; }
.keys { font-size: 13px; color: var(--muted); }
@media (hover: none) { .keys { display: none; } }
.primary, .secondary {
  min-height: 52px; border-radius: 12px; font-weight: 700; font-size: 17px; cursor: pointer; white-space: nowrap; padding: 0 16px;
}
.primary { background: var(--cone); color: var(--on-cone); border: 0; }
.secondary { background: transparent; border: 1px solid var(--line); }
.secondary.small { min-height: 44px; font-size: 15px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.sub { color: var(--muted); font-variant-numeric: tabular-nums; }
.codebox { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.code { font-family: var(--font-display); font-size: 48px; line-height: 1; letter-spacing: .06em; font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.people .chip { background: var(--surface-2); }

/* 경기 중 */
.hud {
  position: fixed; z-index: 3; top: calc(10px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
}
.chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 8px;
  border-radius: 10px; background: var(--ctl); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip.me { font-weight: 800; border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pips { display: inline-flex; gap: 3px; align-items: flex-end; }
.pips i { width: 9px; height: 11px; background: var(--line); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.pips i.on { background: var(--cone); }
.extra { font-variant-numeric: tabular-nums; color: var(--muted); }
.bar { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 3px; border-radius: 2px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--cone); transform-origin: left; transform: scaleX(0); }

.toast {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  top: calc(64px + env(safe-area-inset-top, 0px)); max-width: calc(100% - 32px); box-sizing: border-box;
  padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 4px 14px var(--shade); font-weight: 600; text-align: center; pointer-events: none;
}
.count {
  position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-display); font-size: 120px; line-height: 1; color: var(--over);
  text-shadow: 0 4px 18px var(--over-shadow);
}
.homebtn {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 8px; border-radius: 22px; cursor: pointer;
  background: var(--ctl); border: 1px solid var(--line); font-size: 14px; font-weight: 700; white-space: nowrap; touch-action: manipulation;
}
.homebtn svg { width: 28px; height: 28px; display: block; }

.controls {
  position: fixed; z-index: 3; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: space-between; align-items: center; gap: 12px; pointer-events: none;
}
.controls > * { pointer-events: auto; }
.ctl {
  width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; padding: 0; cursor: pointer;
  background: var(--ctl); border: 1px solid var(--line); color: var(--ink); touch-action: none;
}
.ctl svg { width: 28px; height: 28px; }
.ctl.on { background: var(--ctl-on); }
.ctl.grab {
  flex: 0 1 220px; width: auto; min-width: 0; border-radius: 33px; border: 0; padding: 0 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1.25;
  background: var(--cone); color: var(--on-cone);
}
.ctl.grab.on { filter: brightness(.92); }
.gmain { font-size: 17px; font-weight: 800; white-space: nowrap; }
.gsub { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ctl.grab[aria-disabled="true"] { background: var(--ctl); color: var(--muted); border: 1px solid var(--line); }
.qr { background: var(--qr-bg); border-radius: 12px; padding: 10px; display: grid; place-items: center; min-height: 120px; color: #15212B; font-size: 14px; }
.qr svg { width: 100%; max-width: 300px; height: auto; display: block; }
.invite { display: grid; gap: 12px; }
details summary { font-size: 13px; color: var(--muted); cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.scanner { position: fixed; inset: 0; z-index: 20; background: var(--scan-bg); }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanframe { position: absolute; left: 50%; top: 45%; width: min(70vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%); border: 3px solid var(--over); border-radius: 16px; box-shadow: 0 0 0 100vmax rgb(0 0 0 / .35); }
.scanhint { position: absolute; left: 0; right: 0; top: calc(16px + env(safe-area-inset-top, 0px)); text-align: center; color: var(--over); font-weight: 700; padding: 0 16px; text-shadow: 0 1px 4px var(--over-shadow); }
.scancancel { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--surface); min-width: 120px; }
</style>

<canvas id="scene" aria-hidden="true"></canvas>

<div id="hud" class="hud" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="count" class="count" aria-hidden="true" hidden></div>
<button id="homeBtn" class="homebtn" type="button" hidden>
  <svg id="compass" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-opacity=".25"/><path id="needle" d="M14 5 L19.5 18 L14 15.2 L8.5 18 Z" fill="currentColor"/></svg>
  <span data-t="home"></span>
</button>

<section id="menu" class="panel" aria-labelledby="ttl">
  <div class="brand">
    <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M12.3 4h5.4l7 20H5.3z" fill="#F26B1D"/><path d="M10.6 12.2h8.8l1.4 4H9.2z" fill="#fff"/><rect x="3" y="24" width="24" height="3" rx="1" fill="#F26B1D"/></svg>
    <h1 id="ttl" data-t="title"></h1>
  </div>
  <p class="rule" data-t="rule"></p>
  <fieldset>
    <legend data-t="view"></legend>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="view" id="v-first" value="first"><span data-t="first"></span></label>
      <label><input type="radio" name="view" id="v-third" value="third"><span data-t="third"></span></label>
    </div>
    <p id="sixNote" class="note" data-t="six" hidden></p>
  </fieldset>
  <fieldset>
    <legend data-t="players"></legend>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="count" id="c3" value="3"><span data-n="3"></span></label>
      <label><input type="radio" name="count" id="c4" value="4"><span data-n="4"></span></label>
      <label><input type="radio" name="count" id="c5" value="5"><span data-n="5"></span></label>
      <label><input type="radio" name="count" id="c6" value="6"><span data-n="6"></span></label>
    </div>
  </fieldset>
  <label class="langrow" for="lang">
    <span class="lbl">언어 · Language</span>
    <select id="lang">
      <option value="auto" data-t="auto"></option>
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select>
  </label>
  <p class="keys" data-t="keys"></p>
  <p id="menuErr" class="err" role="alert" hidden></p>
  <div class="row">
    <button id="solo" class="primary" type="button" data-t="solo"></button>
    <button id="together" class="secondary" type="button" data-t="together" hidden></button>
  </div>
</section>

<section id="joinPanel" class="panel" aria-labelledby="joinT" hidden>
  <h2 id="joinT" data-t="together"></h2>
  <p class="note" data-t="togetherNote"></p>
  <button id="create" class="primary" type="button" data-t="create"></button>
  <button id="scanJoin" class="secondary" type="button" data-t="scanJoin"></button>
  <p id="joinErr" class="err" role="alert" hidden></p>
  <button id="joinBack" class="secondary small" type="button" data-t="back"></button>
</section>

<section id="answerPanel" class="panel" aria-labelledby="ansT" hidden>
  <h2 id="ansT" data-t="showHost"></h2>
  <div id="ansQr" class="qr"></div>
  <p id="ansNote" class="note" data-t="showHostNote"></p>
  <details>
    <summary data-t="hostNoCam"></summary>
    <div class="row" style="margin-top:8px">
      <input id="ansText" class="code-in" type="text" readonly aria-label="code">
      <button id="ansCopy" class="secondary small" type="button" data-t="copy" style="flex:0 0 auto"></button>
    </div>
  </details>
  <button id="ansCancel" class="secondary small" type="button" data-t="cancel"></button>
</section>

<section id="lobby" class="panel" aria-labelledby="lobT" hidden>
  <div>
    <span id="lobT" class="lbl" data-t="people" style="display:block"></span>
    <div id="lobPeople" class="people"></div>
  </div>
  <div id="invite" class="invite" hidden>
    <div id="qrBox" class="qr"></div>
    <p id="inviteNote" class="note"></p>
    <div class="row">
      <button id="scanFriend" class="primary" type="button" data-t="scanFriend"></button>
      <button id="inviteCancel" class="secondary" type="button" data-t="cancel"></button>
    </div>
    <details>
      <summary data-t="noCam"></summary>
      <div class="row" style="margin-top:8px">
        <input id="pasteIn" class="code-in" type="text" autocomplete="off" aria-label="code">
        <button id="pasteGo" class="secondary small" type="button" data-t="paste" style="flex:0 0 auto"></button>
      </div>
    </details>
  </div>
  <button id="inviteBtn" class="secondary" type="button" data-t="invite"></button>
  <fieldset id="lobViewWrap">
    <legend data-t="view"></legend>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="lview" id="lv-first" value="first"><span data-t="first"></span></label>
      <label><input type="radio" name="lview" id="lv-third" value="third"><span data-t="third"></span></label>
    </div>
  </fieldset>
  <p id="lobNote" class="note"></p>
  <p id="lobErr" class="err" role="alert" hidden></p>
  <div class="row" id="lobRow">
    <button id="lobStart" class="primary" type="button" data-t="start"></button>
    <button id="lobLeave" class="secondary" type="button" data-t="leave"></button>
  </div>
</section>

<div id="scanner" class="scanner" hidden>
  <video id="scanVideo" playsinline muted></video>
  <div class="scanframe" aria-hidden="true"></div>
  <p class="scanhint" data-t="scanHint"></p>
  <button id="scanCancel" class="secondary scancancel" type="button" data-t="cancel"></button>
</div>

<section id="result" class="panel" aria-labelledby="resT" hidden>
  <h2 id="resT"></h2>
  <p id="resS" class="sub"></p>
  <p id="resWait" class="note" data-t="waitAgain" hidden></p>
  <div class="row">
    <button id="again" class="primary" type="button" data-t="again"></button>
    <button id="toMenu" class="secondary" type="button" data-t="menu"></button>
    <button id="toLobby" class="secondary" type="button" data-t="toLobby"></button>
    <button id="resLeave" class="secondary" type="button" data-t="leave"></button>
  </div>
</section>

<div id="controls" class="controls" hidden>
  <button id="bL" class="ctl" type="button" data-aria="left"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 6 9 14l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="bG" class="ctl grab" type="button"><span class="gmain" data-t="grab"></span><span id="gsub" class="gsub"></span></button>
  <button id="bR" class="ctl" type="button" data-aria="right"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="m11 6 8 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* ---------- 상태 ---------- */
// role: solo(혼자) · host(방장, 판을 굴린다) · guest(손님, 내 몸만 움직이고 나머지는 방장이 보낸 대로)
const G = {
  state: 'menu', role: 'solo', me: 0, players: [], cones: [], world: null, view: 'first',

const d2 = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);
const wrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

const isLocal = p => p.i === G.me || (authority() && p.kind === 'bot');

function buildWorld(n, humans) {
  if (G.world) scene.remove(G.world);
  const w = new THREE.Group();
  G.world = w; scene.add(w);
  G.players = []; G.cones = [];
  for (let i = 0; i < n; i++) {
    const a = Math.PI / 2 + i * TAU / n, bx = Math.cos(a) * BASE_D, bz = Math.sin(a) * BASE_D, col = COLORS[i];
    const disc = flat(new THREE.Mesh(new THREE.CircleGeometry(BASE_R, 40), new THREE.MeshLambertMaterial({ color: col, transparent: true, opacity: 0.5 })));

    const pole = new THREE.Mesh(poleG, poleM);
    const ox = bx + Math.cos(a) * (BASE_R + 0.4), oz = bz + Math.sin(a) * (BASE_R + 0.4);
    pole.position.set(ox, 1.6, oz);
    const flag = new THREE.Mesh(flagG, lam(col)); flag.position.set(ox, 2.9, oz); flag.rotation.y = -a;
    flag.position.x += Math.sin(a) * 0.45; flag.position.z -= Math.cos(a) * 0.45;
    const ring = flat(new THREE.Mesh(new THREE.RingGeometry(BASE_R + 0.15, BASE_R + 0.45, 48, 1, Math.PI / 2, TAU), new THREE.MeshBasicMaterial({ color: 0xF26B1D })));
    ring.position.set(bx, 0.03, bz); ring.visible = false;
    const mesh = makePlayer(col);
    w.add(disc, edge, pole, flag, ring, mesh);
    const h = Math.atan2(-bx, -bz);
    const kind = i === G.me ? 'me' : humans.includes(i) ? 'human' : 'bot';
    G.players.push({
      i, kind, x: bx, z: bz, h, th: h, rx: bx, rz: bz, rh: h, carry: -1, hold: 0, tickT: 0,
      base: { x: bx, z: bz }, mesh, ring,
      speed: kind === 'bot' ? BOT_SPEED * (0.94 + Math.random() * 0.1) : SPEED,
      ai: { target: -1, think: Math.random() * 0.4, grabT: 0 }
    });
  }
  for (let k = 0; k < CONES; k++) {
    const a = k / CONES * TAU - Math.PI / 2, mesh = makeCone();
    w.add(mesh);

}

function counts() {
  const c = new Array(G.players.length).fill(0);
  for (const k of G.cones) if (k.owner >= 0) c[k.owner]++;
  return c;
}
const canTake = (p, c) => c.carrier < 0 && c.owner !== p.i;
function nearestTake(p, r) {

  for (const c of G.cones) {
    if (!canTake(p, c)) continue;
    const d = d2(p.x, p.z, c.x, c.z);
    if (d <= bd) { bd = d; best = c; }
  }

}

}

/* ---------- 판 굴리기 (혼자·방장만) ---------- */
function emit(e) {
  handleEvent(e);
  if (G.role === 'host') G.events.push(e);
}
function grab(p, c) {
  const from = c.owner;
  c.owner = -1; c.slot = -1; c.carrier = p.i; p.carry = c.i;
  emit({ e: 'grab', who: p.i });
  if (from >= 0) emit({ e: 'stole', by: p.i, from });
}
function deposit(p) {
  const c = G.cones[p.carry];
  const used = new Set(G.cones.filter(k => k.owner === p.i).map(k => k.slot));
  let s = 0;
  while (used.has(s)) s++;
  const a = s / CONES * TAU + Math.atan2(p.base.z, p.base.x);
  c.x = p.base.x + Math.cos(a) * 0.85; c.z = p.base.z + Math.sin(a) * 0.85;
  c.owner = p.i; c.slot = s; c.carrier = -1; p.carry = -1;
  emit({ e: 'dep', who: p.i });
}

// 봇: 가까운 것, 집에서 가까운 것, 많이 모은 사람 것을 먼저 노린다. 약간 흔들어서 셋이 똑같이 움직이지 않게.
function botThink(b) {
  b.ai.think = 0.35 + Math.random() * 0.4;
  if (b.carry >= 0) { b.ai.target = -1; return; }
  const cnt = counts();
  let best = -1, bc = Infinity;
  for (const c of G.cones) {
    if (!canTake(b, c)) continue;
    let cost = d2(b.x, b.z, c.x, c.z) + d2(c.x, c.z, b.base.x, b.base.z) * 0.5;
    if (c.owner >= 0) cost += 4 - cnt[c.owner] * 2.5;
    cost += (Math.random() - 0.5) * 2.4;
    if (c.i === b.ai.target) cost -= 1.5;
    if (cost < bc) { bc = cost; best = c.i; }
  }
  b.ai.target = best;
}
function botUpdate(b, dt) {
  b.ai.think -= dt;
  const tc = b.ai.target >= 0 ? G.cones[b.ai.target] : null;
  if (b.ai.think <= 0 || (b.carry < 0 && (!tc || !canTake(b, tc)))) botThink(b);
  let tx = b.base.x, tz = b.base.z;
  if (b.carry < 0 && b.ai.target >= 0) { tx = G.cones[b.ai.target].x; tz = G.cones[b.ai.target].z; }
  const dist = d2(b.x, b.z, tx, tz);
  const diff = wrap(Math.atan2(tx - b.x, tz - b.z) - b.h);
  const tr = 5 * dt;
  b.h += Math.max(-tr, Math.min(tr, diff)); b.th = b.h;
  if (dist > (b.carry >= 0 ? 0.3 : 0.5)) move(b, b.speed * dt * (Math.abs(diff) < 0.9 ? 1 : 0.35));
  if (b.carry < 0 && b.ai.target >= 0 && dist < GRAB_R * 0.85) {
    b.ai.grabT += dt;
    if (b.ai.grabT > 0.15) { const c = nearestTake(b, GRAB_R); if (c) grab(b, c); b.ai.grabT = 0; }
  } else b.ai.grabT = 0;
}
// 사람은 각자 자기 몸을 움직이니 봇만 밀어낸다
function separateBots() {
  const L = G.players;
  for (let a = 0; a < L.length; a++) for (let b = a + 1; b < L.length; b++) {
    const A = L[a], B = L[b];
    if (A.kind !== 'bot' && B.kind !== 'bot') continue;
    const dx = B.x - A.x, dz = B.z - A.z, d = Math.hypot(dx, dz);
    if (d < 1e-4 || d >= PR * 2) continue;
    const push = PR * 2 - d, nx = dx / d, nz = dz / d;
    const wa = A.kind === 'bot' ? (B.kind === 'bot' ? 0.5 : 1) : 0, wb = 1 - wa;
    A.x -= nx * push * wa; A.z -= nz * push * wa; B.x += nx * push * wb; B.z += nz * push * wb;
    clamp(A); clamp(B);
  }
}
function simulate(dt) {
  G.time += dt;
  for (const p of G.players) if (p.kind === 'bot') botUpdate(p, dt);
  separateBots();
  for (const p of G.players) {
    if (p.kind !== 'bot' && p.carry < 0) { const c = nearestTake(p, TOUCH_R); if (c) grab(p, c); }
  }
  for (const p of G.players) if (p.carry >= 0 && inBase(p)) deposit(p);
  const cnt = counts();
  for (const p of G.players) {
    if (cnt[p.i] >= NEED) {
      if (p.hold === 0) emit({ e: 'hold', who: p.i });
      p.hold += dt;
      if (p.hold >= HOLD) { p.hold = HOLD; G.winner = p.i; setState('over'); return; }
    } else p.hold = 0;
  }
}

/* ---------- 내 몸 (모두) ---------- */
// 가져올 곳: 가운데('c')와 다른 사람 자리(번호). ◀ ▶가 한 칸씩 옮기고, 가만히 있을 땐 그쪽을 바라본다.
function spotPos(key) {

  const p = G.players[key];
  return p ? p.base : null;
}
const spotOf = c => (c.owner >= 0 ? c.owner : 'c');
const spotName = key => (key === 'c' ? t('center') : t('spot', { c: colorName(key) }));
function conesAt(key) {
  const me = G.players[G.me];
  return G.cones.filter(c => canTake(me, c) && spotOf(c) === key);
}
function nearestAt(key) {
  const me = G.players[G.me];
  let best = null, bd = Infinity;
  for (const c of conesAt(key)) { const d = d2(me.x, me.z, c.x, c.z); if (d < bd) { bd = d; best = c; } }
  return best;
}
function stepSpot(dir) {

  const me = G.players[G.me];
  const ang = k => { const s = spotPos(k); return Math.atan2(s.x - me.x, s.z - me.z); };
  const cur = ang(G.sel);
  // 왼쪽(dir 1)은 지금 고른 곳에서 시계 반대쪽으로 가장 가까운 칸, 끝이면 반대편 끝으로 돈다

    if (k === G.sel) continue;
    let d = wrap(ang(k) - cur) * dir;

function update(dt) {
  if (G.state === 'menu' || G.state === 'lobby') {
    if (!reduce.matches) G.orbit += dt * 0.08;
    net.tick(dt);
    return;
  }
  if (G.state === 'count') {
    if (authority()) { G.countT -= dt; if (G.countT <= 0) setState('play'); }
    const n = Math.ceil(G.countT);
    if (G.state === 'count' && n !== G.lastN && n > 0) { G.lastN = n; showCount(String(n)); sfx.count(n); }
  }
  if (G.goT > 0) { G.goT -= dt; if (G.goT <= 0) $('count').hidden = true; }
  if (G.state === 'play') {
    meUpdate(dt);

  }
  // 셋을 모은 사람 쪽에서 똑딱 (방장이 보낸 값으로 손님도 같이 울린다)
  for (const p of G.players) {

    else p.tickT = 0;
  }
  // 남이 움직이는 몸은 부드럽게 따라간다
  const k = Math.min(1, dt * 12);
  for (const p of G.players) {
    if (isLocal(p) || d2(p.rx, p.rz, p.x, p.z) > 4) { p.rx = p.x; p.rz = p.z; p.rh = p.h; }
    else { p.rx += (p.x - p.rx) * k; p.rz += (p.z - p.rz) * k; p.rh += wrap(p.h - p.rh) * k; }
  }
  net.tick(dt);
}

async function pack(desc) {

    .filter(l => l && !/^a=(extmap-allow-mixed|msid-semantic)/.test(l) && !/^a=candidate:\S+ \d+ tcp /i.test(l))

  if (code[1] === 'z') data = await pipe(data, new DecompressionStream('deflate-raw'));

// QR 글자에서 쪽지만: 초대는 주소(…#j=쪽지), 답은 쪽지 그대로

}

    if (pc.iceGatheringState === 'complete') return ok();
    const timer = setTimeout(ok, 3000);

  });
}

const net = {
  pc: null, dc: null, answer: '',      // 손님: 방장으로 가는 통로 하나
  peers: [], pending: null, nextId: 0, // 방장: 들어온 손님들(차례대로), 지금 부르는 자리
  myId: 0, peerIds: [], map: {}, sendT: 0,
  send(o) { if (this.dc && this.dc.readyState === 'open') this.dc.send(JSON.stringify(o)); },
  broadcast(o) {
    const s = JSON.stringify(o);
    for (const p of this.peers) if (p.dc.readyState === 'open') p.dc.send(s);
  },
  tick(dt) {
    if (G.role === 'solo' || !['count', 'play', 'over'].includes(G.state)) return;
    this.sendT -= dt;
    if (this.sendT > 0) return;
    this.sendT = 0.05;
    if (G.role === 'host') {
      this.broadcast({
        k: 's', st: G.state, ct: r2(G.countT), tm: r2(G.time), w: G.winner,
        b: G.players.filter(p => p.kind === 'bot').map(p => p.i),
        p: G.players.map(p => [r2(p.x), r2(p.z), r2(p.h), p.carry, r2(p.hold)]),
        c: G.cones.map(c => [r2(c.x), r2(c.z), c.owner, c.carrier]),
        ev: G.events.splice(0)

    } else {
      const me = G.players[G.me];

  }

function closeSlot(s) {

}

  try { if (pc) pc.close(); } catch (_) {}
  const all = net.peers.concat(net.pending ? [net.pending] : []);

}

async function startInvite() {
  if (G.role !== 'host' || net.peers.length >= 5) return;
  closeSlot(net.pending);
  $('lobErr').hidden = true;
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const dc = pc.createDataChannel('gokkal');
  const slot = { id: ++net.nextId, pc, dc, dead: false };
  net.pending = slot;
  renderInvite('making');
  dc.onopen = () => {
    if (slot.dead) return;
    if (net.pending === slot) net.pending = null;
    if (G.role !== 'host' || G.state !== 'lobby' || net.peers.length >= 5) { dc.send(JSON.stringify({ k: 'busy' })); setTimeout(() => closeSlot(slot), 300); renderInvite(null); return; }
    net.peers.push(slot);
    dc.send(JSON.stringify({ k: 'hello', id: slot.id }));
    sendLobby();
    renderInvite(null);
    renderLobby();
    sfx.deposit();
  };
  dc.onmessage = e => { let d; try { d = JSON.parse(e.data); } catch (_) { return; } onGuestMsg(slot.id, d); };
  dc.onclose = () => guestLeft(slot);
  pc.onconnectionstatechange = () => {
    if (pc.connectionState !== 'failed' || slot.dead) return;
    if (net.pending === slot) { lobbyError(t('errFail')); cancelInvite(); }
    else guestLeft(slot);
  };
  try {
    await pc.setLocalDescription(await pc.createOffer());
    await gathered(pc);
    const code = await pack(pc.localDescription);
    await loadScript(LIB_QR);
    if (net.pending !== slot) return;
    drawQr($('qrBox'), location.origin + location.pathname + location.search + '#j=' + code);
    renderInvite('show');
  } catch (e) {
    if (net.pending === slot) { lobbyError(t('errFail')); cancelInvite(); }
  }
}
async function acceptAnswer(text) {
  const slot = net.pending;
  if (!slot) return;
  const code = codeFrom(text);
  let desc;
  try { if (!code || code[0] !== 'a') throw 0; desc = await unpack(code); } catch (_) { lobbyError(t('errQr')); return; }
  try {
    await slot.pc.setRemoteDescription(desc);
    $('lobErr').hidden = true;
    renderInvite('connecting');
  } catch (_) { lobbyError(t('errOld')); }
}
function cancelInvite() { closeSlot(net.pending); net.pending = null; renderInvite(null); }
function guestLeft(slot) {
  const k = net.peers.indexOf(slot);
  if (k < 0) return;
  net.peers.splice(k, 1);
  closeSlot(slot);
  if (G.role !== 'host') return;
  if (G.state === 'lobby') { sendLobby(); renderLobby(); return; }
  const idx = net.map[slot.id], pl = G.players[idx];

  if (pl && pl.kind === 'human') {

}

function onGuestMsg(id, d) {
  if (d.k !== 'me') return;
  const idx = net.map[id], p = idx !== undefined && G.players[idx];
  if (!p || p.kind !== 'human' || !Number.isFinite(d.x) || !Number.isFinite(d.z) || !Number.isFinite(d.h)) return;

async function joinWith(code) {
  audio();
  leaveNet();
  G.role = 'guest'; G.me = 0;
  if (G.state !== 'menu') setState('menu');
  hidePanels();
  $('ansQr').textContent = t('making');
  $('ansNote').textContent = t('showHostNote');
  $('ansText').value = '';
  $('ansCopy').disabled = true;
  $('answerPanel').hidden = false;
  let desc;
  try { desc = await unpack(code); if (desc.type !== 'offer') throw 0; } catch (_) { joinError(t('errQr')); return; }
  const pc = new RTCPeerConnection({ iceServers: ICE });
  net.pc = pc;
  pc.ondatachannel = e => {
    const dc = e.channel;
    net.dc = dc;
    dc.onmessage = ev => { let d; try { d = JSON.parse(ev.data); } catch (_) { return; } onHostMsg(d); };
    dc.onclose = () => { if (net.dc === dc) dropped(t('errClosed')); };
  };
  pc.onconnectionstatechange = () => {
    if (net.pc !== pc) return;
    if (pc.connectionState === 'connecting') $('ansNote').textContent = t('connecting');
    if (pc.connectionState === 'failed') dropped(t(net.myId ? 'errClosed' : 'errFail'));
  };
  try {
    await pc.setRemoteDescription(desc);
    await pc.setLocalDescription(await pc.createAnswer());
    await gathered(pc);
    if (net.pc !== pc) return;
    net.answer = await pack(pc.localDescription);
    await loadScript(LIB_QR);
    if (net.pc !== pc) return;
    drawQr($('ansQr'), net.answer);
    $('ansText').value = net.answer;
    $('ansCopy').disabled = false;
  } catch (_) {
    if (net.pc === pc) dropped(t('errFail'));
  }
}
function onHostMsg(d) {
  if (d.k === 'hello') {
    net.myId = d.id;
  } else if (d.k === 'lobby') {
    net.peerIds = Array.isArray(d.peers) ? d.peers : [];
    if (G.state !== 'lobby') showLobby(); else renderLobby();
  } else if (d.k === 'start') {
    const idx = d.map && d.map[net.myId];
    if (!Number.isInteger(idx) || !Number.isInteger(d.n)) return;
    audio();
    G.me = idx;
    beginMatch(d.n, Array.isArray(d.humans) ? d.humans : [0, idx], d.view === 'third' ? 'third' : 'first');
  } else if (d.k === 'busy') {
    dropped(t('errStarted'));
  } else if (d.k === 's' && G.players.length) {
    applySnap(d);
  }
}
function applySnap(d) {
  const bots = new Set(Array.isArray(d.b) ? d.b : []);
  let renamed = false;
  (Array.isArray(d.p) ? d.p : []).forEach((a, i) => {
    const p = G.players[i];
    if (!p || !Array.isArray(a)) return;
    if (i !== G.me) {
      p.x = +a[0] || 0; p.z = +a[1] || 0; p.h = +a[2] || 0;
      if (bots.has(i) && p.kind !== 'bot') { p.kind = 'bot'; renamed = true; }
    }
    p.carry = Number.isInteger(a[3]) ? a[3] : -1;
    p.hold = +a[4] || 0;
  });
  (Array.isArray(d.c) ? d.c : []).forEach((a, i) => {
    const c = G.cones[i];
    if (!c || !Array.isArray(a)) return;
    c.x = +a[0] || 0; c.z = +a[1] || 0;
    c.owner = Number.isInteger(a[2]) ? a[2] : -1;
    c.carrier = Number.isInteger(a[3]) ? a[3] : -1;
  });
  if (renamed) refreshNames();
  G.time = +d.tm || 0; G.countT = +d.ct || 0; G.winner = Number.isInteger(d.w) ? d.w : -1;
  (Array.isArray(d.ev) ? d.ev : []).forEach(e => { if (e && typeof e === 'object') handleEvent(e); });
  if (d.st !== G.state && ['count', 'play', 'over'].includes(d.st)) setState(d.st);
}

/* QR 찍기: 되는 브라우저는 BarcodeDetector, 아니면(아이폰 사파리 등) jsQR */
let scan = null;
async function openScanner(onText) {
  closeScanner();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); }
  catch (_) { return false; }
  let det = null;
  try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (_) {}
  if (!det) { try { await loadScript(LIB_SCAN); } catch (_) {} }
  const video = $('scanVideo');
  video.srcObject = stream;
  $('scanner').hidden = false;
  try { await video.play(); } catch (_) {}
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  const s = scan = { stream, timer: 0, alive: true };
  const step = async () => {
    if (!s.alive) return;
    let text = null;
    if (video.readyState >= 2 && video.videoWidth) {
      try {
        if (det) { const r = await det.detect(video); if (r && r[0]) text = r[0].rawValue; }
        else if (window.jsQR) {
          const w = Math.min(960, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
          cv.width = w; cv.height = h; cx.drawImage(video, 0, 0, w, h);
          const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
          if (r) text = r.data;
        }
      } catch (_) {}
    }
    if (text && s.alive) { closeScanner(); onText(text); return; }
    if (s.alive) s.timer = setTimeout(step, 150);
  };
  step();
  return true;
}
function closeScanner() {
  if (!scan) return;
  scan.alive = false;
  clearTimeout(scan.timer);
  scan.stream.getTracks().forEach(tr => tr.stop());
  scan = null;
  $('scanVideo').srcObject = null;
  $('scanner').hidden = true;
}

// 화면에 보이는 고깔을 누르면 그리로 간다. 손가락이 조금 빗나가도 잡히게 화면 거리로 고른다
const proj = new THREE.Vector3();
canvas.addEventListener('pointerdown', e => {
  if (G.state !== 'play' && G.state !== 'count') return;
  audio();
  const me = G.players[G.me], W = innerWidth, H = innerHeight;
  let best = null, bd = 90;
  for (const c of G.cones) {
    if (!canTake(me, c)) continue;
    proj.set(c.x, 0.45, c.z).project(camera);
    if (proj.z < -1 || proj.z > 1) continue;
    const d = Math.hypot((proj.x + 1) / 2 * W - e.clientX, (1 - proj.y) / 2 * H - e.clientY);
    if (d < bd) { bd = d; best = c; }
  }
  if (best) { G.sel = spotOf(best); G.auto = { cone: best.i }; return; }
  proj.set(me.base.x, 0, me.base.z).project(camera);
  if (proj.z >= -1 && proj.z <= 1 && Math.hypot((proj.x + 1) / 2 * W - e.clientX, (1 - proj.y) / 2 * H - e.clientY) < 80) G.auto = { home: true };
});

  if ((G.state !== 'play' && G.state !== 'count') || e.repeat) return;

  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); stepSpot(-1); }
